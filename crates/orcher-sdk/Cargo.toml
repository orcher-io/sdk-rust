[package]
name = "orcher-sdk"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
documentation.workspace = true
description = "Rust SDK for Orcher, a durable workflow engine: workflows, tasks, actors, workers and a client"
readme = "../../README.md"
keywords = ["workflow", "orchestration", "durable-execution", "async", "sdk"]
categories = ["asynchronous", "concurrency", "network-programming"]

[dependencies]
# Core SDK and protocol definitions
orcher-sdk-core = "0.8"
orcher-proto = "0.1"

# Macros (optional, in this workspace; published before this crate)
orcher-sdk-macros = { workspace = true, optional = true }
inventory = { version = "0.3", optional = true }

# Metrics
metrics = "0.22"

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
dashmap = "5.5"
uuid = { version = "1.0", features = ["v4", "v5"] }
tracing = "0.1"
url = "2"
rand = "0.8"

# gRPC
tonic = { version = "0.12", features = ["transport", "tls", "tls-native-roots"] }

# Optional compression
flate2 = { version = "1.0", optional = true }

# Actor state cache
moka = { version = "0.12", features = ["future"] }

# Optional auto-registration
once_cell = { version = "1", optional = true }
ctor = { version = "0.2", optional = true }

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3"
criterion = "0.5"
mockall = "0.12"
proptest = "1.0"
rand = "0.8"
tracing-subscriber = "0.3"

[features]
default = ["full"]
full = ["testing", "auto-register", "derive"]
testing = []
compression = ["flate2"]
auto-register = ["once_cell", "orcher-sdk-macros/auto-register", "ctor", "inventory"]
derive = ["orcher-sdk-macros/derive"]

[lib]
name = "orcher_sdk"
path = "src/lib.rs"

[[bench]]
name = "macro_performance"
harness = false
required-features = ["derive"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
