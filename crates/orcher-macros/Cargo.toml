[package]
name = "orcher-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Procedural macros for the Orcher Rust SDK; use them through the orcher crate"
documentation = "https://docs.rs/orcher-macros"
readme = "../../README.md"
keywords = ["workflow", "orchestration", "durable-execution", "macros", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
darling = "0.20"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
inventory = { version = "0.3", optional = true }
ctor = { version = "0.2", optional = true }

[dev-dependencies]
trybuild = "1.0"
# For the documentation examples, which use the macros through the SDK. Path only,
# so cargo drops it when publishing and the crates do not depend on each other there.
orcher = { path = "../orcher" }
tokio = { version = "1", features = ["macros", "rt"] }

[features]
default = ["workflow", "task"]
workflow = []
task = []
query = []
event = []
derive = []
auto-register = ["dep:ctor", "inventory"]
full = ["workflow", "task", "query", "event", "derive", "auto-register"]

[package.metadata.docs.rs]
all-features = true
