# Local cross-repo development override (opt-in).
#
# Copy this file to `.cargo/config.toml` (git-ignored) to build against sibling
# `../sdk-core` and `../protos` checkouts instead of the crates.io releases in
# Cargo.toml, so the core and this SDK can be changed together with live
# recompilation.
#
#   cp .cargo/config.example.toml .cargo/config.toml
#
# `paths` overrides apply at build time but are NOT recorded in Cargo.lock, so
# the declared versions stay authoritative for anyone who has not opted in.
paths = ["../sdk-core", "../protos"]
