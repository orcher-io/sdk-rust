[package]
name = "orcher-example-durable-execution"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
orcher-sdk = { path = "../../crates/orcher-sdk", features = ["auto-register"] }

tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
clap = { version = "4.4", features = ["derive", "env"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
once_cell = "1.19"

# The engine's benchmark and cluster scripts run this binary by name.
[[bin]]
name = "durable-execution-service"
path = "src/main.rs"
