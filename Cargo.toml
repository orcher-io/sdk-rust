[workspace]
resolver = "2"
# The examples are members so every CI run compiles them against this SDK.
members = [
    "crates/orcher-sdk",
    "crates/orcher-sdk-macros",
    "contract",
    "examples/actors",
    "examples/durable_execution",
    "examples/quickstart",
]

[workspace.package]
version = "0.11.4"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
repository = "https://github.com/orcher-io/sdk-rust"
homepage = "https://github.com/orcher-io"
documentation = "https://docs.rs/orcher-sdk"

# Workspace crates that depend on each other. The version is what gets published
# with the dependency, so it must match `[workspace.package]`; release-please
# bumps both (see release-please-config.json).
[workspace.dependencies]
orcher-sdk-macros = { path = "crates/orcher-sdk-macros", version = "0.11.4" }
