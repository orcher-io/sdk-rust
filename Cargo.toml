[workspace]
resolver = "2"
members = [
    "crates/orcher-sdk",
    "crates/orcher-sdk-macros",
    "contract",
]

[workspace.package]
version = "0.5.2"
edition = "2021"
license = "Apache-2.0"
authors = ["ORCHER Contributors"]
repository = "https://github.com/orcher-io/sdk-rust"
homepage = "https://github.com/orcher-io"
documentation = "https://docs.rs/orcher-sdk"

# Workspace crates that depend on each other. The version is what gets published
# with the dependency, so it must match `[workspace.package]`; release-please
# bumps both (see release-please-config.json).
[workspace.dependencies]
orcher-sdk-macros = { path = "crates/orcher-sdk-macros", version = "0.5.2" }

# Until the sdk-core release that carries `ExecutionResult::reached_steps`
# (orcher-io/sdk-core#13) is published: then this goes, and the dependency
# moves to that release.
[patch.crates-io]
orcher-sdk-core = { git = "https://github.com/orcher-io/sdk-core", branch = "fix/replay-divergence" }
